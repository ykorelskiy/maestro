name: Supabase Keep-Alive

on:
  schedule:
    # 3 раза в день: в 00:00, 08:00 и 16:00 UTC (03:00, 11:00, 19:00 MSK)
    # Гарантирует выполнение требования Supabase "a few requests every day"
    - cron: '0 */8 * * *'
  workflow_dispatch: # ручной запуск для тестирования

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ping Supabase (Read & Write heartbeat)
        run: node scripts/keepalive.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
